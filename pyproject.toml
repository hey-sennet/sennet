[project]
name = "agent-talk"
version = "0.1.0.dev0"
description = "Talk to your coding agents: a self-hosted voice interface for Codex, Claude Code and Gemini CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "platformdirs>=4",
    "tomli-w>=1",
]

[project.scripts]
agent-talk = "agent_talk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_talk"]
# The built web client is not in git; include it when present.
artifacts = ["src/agent_talk/web/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
