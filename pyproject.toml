[project]
name = "agent-talk"
version = "0.1.0.dev0"
description = "Talk to your coding agents: a self-hosted voice interface for Codex, Claude Code and Gemini CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICES"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "platformdirs>=4",
    "tomli-w>=1",
    # Speech. The ONNX runtime comes from the cpu or cuda extra, which `agent-talk setup` picks.
    "numpy>=2",
    "onnx-asr>=0.12",
    "phonemizer>=3.3",       # GPL-3.0-or-later, see NOTICES
    "espeakng-loader>=0.2.4",  # bundles espeak-ng, GPL-3.0
    "rich>=13",
    "questionary>=2",
    "segno>=1.6",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,!=1.24.1,!=1.25.*,!=1.26.0"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.20,!=1.24.1,!=1.25.*,!=1.26.0; sys_platform == 'linux'"]

[project.scripts]
agent-talk = "agent_talk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
# Both runtimes install the `onnxruntime` module, so only one may be present.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_talk"]
# The built web client is not in git; include it when present.
artifacts = ["src/agent_talk/web/**"]

[tool.hatch.build.targets.sdist]
# The package, its tests and the client's source; not the spikes (their models and caches are gigabytes).
include = ["/src/agent_talk", "/tests", "/frontend", "/LICENSE", "/NOTICES", "/README.md"]
exclude = ["frontend/node_modules", "frontend/test-results", "frontend/playwright-report", "**/__pycache__"]
artifacts = ["src/agent_talk/web/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["models: needs the downloaded speech models (set AGENT_TALK_MODELS)"]
addopts = "-m 'not models'"
