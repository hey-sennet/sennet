# Builds, checks and publishes a release (docs/m6-packaging.md).
#
# A tag such as v0.1.0 publishes to PyPI and makes a GitHub release. Running the workflow by
# hand publishes the current commit to TestPyPI instead, to try the release path first.
# Both use trusted publishing: PyPI and TestPyPI each need this repository, this workflow
# and its environment (pypi or testpypi) registered as a trusted publisher.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --no-project python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/agent_talk/__init__.py").read())[1])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but the package is $version"; exit 1; }
      - run: cd frontend && npm ci && npm run build
      - run: uv build
      - run: scripts/check-dist.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: scripts/smoke-test.sh dist/*.whl cpu

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
