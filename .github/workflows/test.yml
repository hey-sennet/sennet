# Tests on every push to main and every pull request (docs/m6-packaging.md).
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2   # it has no major tags since v8
      # libopus for Opus voice (src/sennet/voice/opus.py); without it those tests skip.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libopus0
      - if: runner.os == 'macOS'
        run: brew install opus
      - run: uv sync --locked --extra cpu
      - run: uv run pytest

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2   # it has no major tags since v8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: uv sync --locked --extra cpu   # the browser tests run against the Python server
      - run: sudo apt-get install -y libopus0   # voice.spec.ts checks Opus both ways
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2   # it has no major tags since v8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - run: uv build
      - run: scripts/check-dist.sh dist
      - run: scripts/smoke-test.sh dist/*.whl cpu
