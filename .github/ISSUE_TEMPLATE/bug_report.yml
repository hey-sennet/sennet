name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Select the project...
        2. Say "..."
  - type: textarea
    id: report
    attributes:
      label: Report from `sennet doctor --report`
      description: |
        Run `sennet doctor --report` and drag the file it writes here. It has Sennet's checks, versions, hardware, settings and the end of the log, with paths, names, addresses and keys taken out. Read it first, and remove anything you'd rather not share. If Sennet won't run far enough to write it, paste the output of `sennet doctor` instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Android, Firefox on the same Linux machine
